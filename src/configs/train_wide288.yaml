defaults:
  - train_char100
  - override model: conformer_wide288
  - _self_

datasets:
  train:
    part: train_all
dataloader:
  max_seconds: 300
  max_items: 64
optimizer:
  lr: 0.0005
lr_scheduler:
  warmup_steps: 1000
  total_steps: 100000
trainer:
  device: cuda
  accumulation_steps: 1
  max_steps: 100000
  session_max_steps: 76000
  save_dir: saved/wide288
  init_from: saved/wide288/initialization.pt
writer:
  run_name: wide288
  log_checkpoints: false
