name: ASR checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.5.1+cpu torchaudio==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m ruff check --isolated --extend-exclude '*.ipynb' --select E4,E7,E9,F --target-version py310 .
